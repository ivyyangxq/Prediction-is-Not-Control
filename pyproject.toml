[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "gq-tool"
version = "1.0.3"
description = "Reinforcement learning, support checks and change diagnosis for dynamic economic decisions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "GQ Tool contributors"}]
keywords = ["economics", "panel-data", "policy-learning", "jupyter"]
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.4", "scikit-learn>=1.1", "ipywidgets>=8", "ipykernel>=6", "nbformat>=5", "notebook>=7", "cloudpickle>=2"]
[project.urls]
Repository = "https://github.com/ivyyangxq/Prediction-is-Not-Control"
Issues = "https://github.com/ivyyangxq/Prediction-is-Not-Control/issues"
Documentation = "https://github.com/ivyyangxq/Prediction-is-Not-Control/blob/master/docs/START_HERE.md"

[project.optional-dependencies]
dev = ["build", "twine"]

[project.scripts]
gq-tool = "pinc_toolbox.tool_cli:main"
[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
[tool.setuptools.package-data]
pinc_toolbox = ["_resources/**/*"]
